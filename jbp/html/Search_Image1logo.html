  text-align: center !important;

  transform: none !important;
  -moz-transform: none !important;
  -webkit-transform: none !important;
  -ms-transform: none !important;

  z-index: 999 !important;
}

/* 官方旗艦店 偽元素全部關掉 */
.官方旗艦店::before,
.官方旗艦店::after {
  content: none !important;
  display: none !important;
}

/* 副標案型七字內：拿掉 PS matrix，用等效字號 */
.副標案型七字內 {
  transform: none !important;
  -moz-transform: none !important;
  -webkit-transform: none !important;
  -ms-transform: none !important;
  font-size: 60.08px !important;
  line-height: 1 !important;
}
</style>
</head>

<body data-fw="1125" data-fh="156">

   卻像是完全沒有生效。改成動態插入＋時間戳記，強制每次重新整理都
   向伺服器要最新版本。 */
(function(){
  var s = document.createElement('script');
  s.src = '../js/layout-runtime.js?t=' + Date.now();
  document.head.appendChild(s);
})();
</script>
<!-- 共用左側紅底 Logo 最終覆蓋：放在 runtime 後面，手動改 Search_Image1logo_logo.css 才會生效 -->
<link rel="stylesheet" href="Search_Image1logo_logo.css">
</body>
