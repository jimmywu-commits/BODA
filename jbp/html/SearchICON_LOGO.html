<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>SearchICON_LOGO 排版預覽</title>
<style>
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 300;
  src: url("../fonts/ShopeeNotoSans(content)-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 400;
  src: url("../fonts/ShopeeNotoSans(content)-Medium.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 700;
  src: url("../fonts/ShopeeNotoSans(content)-Bold.ttf") format("truetype");
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#stage { position: relative; }
#canvas {
  position: absolute; top: 0; left: 0;
  overflow: hidden; transform-origin: top left;
  background-color: #ffffff !important; /* 圓底外的區域永遠是白色，不受任何背景色/背景圖同步影響 */
}
#底圖 {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1; pointer-events: none; display: none;
}
#css-err {
  display: none; position: fixed;
  top: 14px; left: 50%; transform: translateX(-50%);
  background: #7f1d1d; color: #fca5a5;
  font-size: 13px; font-family: monospace;
  padding: 7px 16px; border-radius: 6px; z-index: 9999;
}
</style>
</head>
<!-- 搜尋頁 / 搜尋結果頁 ICON：只吃 LOGO（120x120px） -->
<body data-fw="120" data-fh="120">
<div id="css-err"></div>
<div id="stage">
  <div id="canvas">
    <img id="底圖" src="" alt="">
    <!-- 圖層由 layout-runtime.js 從 --layers 自動產生 -->
  </div>
</div>
<script>
/* layout-runtime.js 原本是純靜態 script 標籤載入，沒有防快取機制，
   瀏覽器可能一直用快取住的舊版本，導致改完程式碼、重新整理頁面，
   卻像是完全沒有生效。改成動態插入＋時間戳記，強制每次重新整理都
   向伺服器要最新版本。 */
(function(){
  var s = document.createElement('script');
  s.src = '../js/layout-runtime.js?t=' + Date.now();
  document.head.appendChild(s);
})();
</script>
<script>
/* ════════════════════════════════════════════════════
   SearchICON_LOGO 專用：
   本檔案「不依賴」系統共用 bn-logo/bn-logos 處理器的檔名判斷規則
   （該規則是看檔名是否含「方」字），而是自己攔截原始資料、
   自己從零建立單張 LOGO 顯示，避免因為檔名（含中文字）在不同
   作業系統/壓縮工具間傳輸時被改壞，導致排版讀不到、顯示不出來。

   1) LOGO 圖跟商品的曝品圖一樣，可以用滑鼠拖拉四角放大縮小、
      滾輪縮放、拖曳移動位置。
   2) .logo範圍 本身就是整顆圓（overflow:hidden + 圓形），LOGO 放大超過
      圓底範圍時，會被圓底遮色，只顯示圓內的部分。
   3) 縮放控制點（四角藍點）不會被圓形裁切遮住：另外掛在 #canvas 上，
      不受 .logo範圍 的 overflow:hidden 影響，永遠可以點得到、拖得到。
   下載時額外多存一張 84x84（由 bn-editor-plugin.js 統一處理）。
   ════════════════════════════════════════════════════ */
(function(){
  function getBnId(){
    try{ return String(new URLSearchParams(location.search || '').get('bnid') || ''); }
    catch(_){ return ''; }
  }
  var STORAGE_KEY = 'bn_searchicon_logo_layout_' + getBnId();

  function saveLayout(box){
    try{
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
        left: box.offsetLeft, top: box.offsetTop,
        width: box.offsetWidth, height: box.offsetHeight
      }));
    }catch(_){}
  }

  function loadLayout(){
    try{
      var raw = sessionStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var d = JSON.parse(raw);
      var okNum = function(v){ return typeof v === 'number' && isFinite(v); };
      /* left/top 可以是負值（LOGO 放大超出圓底、拖到邊界外都是合法狀態，
         裁切交給圓形遮色處理），只有 width/height 需要是正數 */
      if(okNum(d.left) && okNum(d.top) && okNum(d.width) && okNum(d.height) && d.width > 0 && d.height > 0){
        return d;
      }
    }catch(_){}
    return null;
  }

  function syncHandlePositions(box, handleLayer){
    var left = box.offsetLeft, top = box.offsetTop, w = box.offsetWidth, h = box.offsetHeight;
    var map = {
      nw: {x: left,     y: top    },
      ne: {x: left + w, y: top    },
      sw: {x: left,     y: top + h},
      se: {x: left + w, y: top + h}
    };
    Object.keys(map).forEach(function(c){
      var h2 = handleLayer.querySelector('[data-corner="'+c+'"]');
      if(!h2) return;
      h2.style.left = (map[c].x - 7) + 'px';
      h2.style.top  = (map[c].y - 7) + 'px';
    });
  }

  function setupWheelZoom(box, zone, handleLayer, ratio){
    box.addEventListener('wheel', function(e){
      e.preventDefault();
      var sc = e.deltaY < 0 ? 1.08 : 0.93;
      var zw = zone.offsetWidth || 120; /* 設計座標，不受畫布縮放顯示影響 */
      var curW = box.offsetWidth, curH = box.offsetHeight;
      var maxW = zw * 3; /* 允許放大超出圓底，交給圓形遮色裁切 */
      var newW = Math.max(20, Math.min(curW * sc, maxW));
      var newH = newW / ratio;
      var cx = box.offsetLeft + curW / 2;
      var cy = box.offsetTop  + curH / 2;
      box.style.width  = newW + 'px';
      box.style.height = newH + 'px';
      box.style.left   = (cx - newW / 2) + 'px';
      box.style.top    = (cy - newH / 2) + 'px';
      syncHandlePositions(box, handleLayer);
      saveLayout(box);
    }, {passive:false});
  }

  function getZoneScale(zone){
    /* 畫布在編輯器裡可能被 CSS transform:scale 縮放顯示（例如縮圖預覽），
       getBoundingClientRect() 量到的是「畫面上看到的」尺寸，
       offsetWidth 量到的才是設計稿真實尺寸（也是下載時 html2canvas 會用的尺寸）。
       兩者的比例＝目前畫布的顯示縮放倍率，滑鼠移動量要先除掉這個倍率，
       才能還原成正確的設計座標，不然畫布看起來對，下載出來會跟畫面不一致。 */
    var dw = zone.offsetWidth || 1;
    var rw = zone.getBoundingClientRect().width || dw;
    return rw / dw || 1;
  }

  function setupDrag(box, zone, handleLayer, ratio){
    box.addEventListener('mousedown', function(e){
      e.preventDefault();
      var S = getZoneScale(zone);
      var startX = e.clientX, startY = e.clientY;
      var startLeft = box.offsetLeft, startTop = box.offsetTop;
      function onMove(ev){
        var dx = (ev.clientX - startX) / S;
        var dy = (ev.clientY - startY) / S;
        box.style.left = (startLeft + dx) + 'px';
        box.style.top  = (startTop  + dy) + 'px';
        syncHandlePositions(box, handleLayer);
      }
      function onUp(){
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        saveLayout(box);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    Array.prototype.slice.call(handleLayer.querySelectorAll('[data-corner]')).forEach(function(handle){
      handle.addEventListener('mousedown', function(e){
        e.preventDefault(); e.stopPropagation();
        var corner = handle.dataset.corner;
        var S = getZoneScale(zone);
        var startX = e.clientX, startY = e.clientY;
        var startW = box.offsetWidth, startH = box.offsetHeight;
        var startLeft = box.offsetLeft, startTop = box.offsetTop;
        function onMove(ev){
          var dx = (ev.clientX - startX) / S;
          var newW = startW, newLeft = startLeft, newTop = startTop;
          if(corner === 'se'){ newW = Math.max(20, startW + dx); }
          else if(corner === 'ne'){ newW = Math.max(20, startW + dx); newTop = startTop - (newW/ratio - startH); }
          else if(corner === 'sw'){ newW = Math.max(20, startW - dx); newLeft = startLeft + (startW - newW); }
          else if(corner === 'nw'){ newW = Math.max(20, startW - dx); newLeft = startLeft + (startW - newW); newTop = startTop - (newW/ratio - startH); }
          var newH = newW / ratio;
          box.style.width  = newW + 'px';
          box.style.height = newH + 'px';
          box.style.left   = newLeft + 'px';
          box.style.top    = newTop + 'px';
          syncHandlePositions(box, handleLayer);
        }
        function onUp(){
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          saveLayout(box);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  function buildLogoBox(src){
    var zone = document.querySelector('.logo範圍');
    var canvas = document.getElementById('canvas');
    if(!zone || !canvas) return;

    zone.style.overflow = 'hidden';
    zone.style.borderRadius = '50%';

    /* 每次呼叫都發一個新的版本號。圖片是非同步載入（img.onload），如果連續
       快速呼叫多次 buildLogoBox（例如使用者連續上傳/替換 LOGO），舊呼叫的
       img 可能在新呼叫「清空重建」之後才慢慢讀完、才 onload——如果沒有這道
       檢查，舊的 onload 還是會把自己的框插進去，跟新的疊在一起，永遠只清
       一次、卻插入好幾次。清空重建的動作也搬到 onload 裡（真正要畫上去的
       那一刻才清），確保任何時候畫面上最多只會有一張 LOGO。 */
    var callToken = (buildLogoBox._token = (buildLogoBox._token || 0) + 1);

    function clearZone(){
      zone.innerHTML = '';
      Array.prototype.slice.call(canvas.querySelectorAll('.bn-logo-handle-layer')).forEach(function(b){ b.remove(); });
    }

    if(!src){ clearZone(); return; }

    var img = new Image();
    img.className = 'bn-logo-img';
    img.onload = function(){
      if(callToken !== buildLogoBox._token) return; /* 已經被更新的呼叫取代，這個舊結果直接放棄 */
      clearZone();
      var zw = zone.clientWidth || 120, zh = zone.clientHeight || 120;
      var ratio = (img.naturalWidth && img.naturalHeight) ? (img.naturalWidth / img.naturalHeight) : 1;
      var boxW, boxH, boxLeft, boxTop;
      var saved = loadLayout();
      if(saved){
        boxW = saved.width; boxH = saved.height;
        boxLeft = saved.left; boxTop = saved.top;
      }else{
        boxW = Math.round(zw * 0.75); boxH = Math.round(boxW / ratio);
        if(boxH > zh * 0.75){ boxH = Math.round(zh * 0.75); boxW = Math.round(boxH * ratio); }
        boxLeft = Math.round((zw - boxW)/2); boxTop = Math.round((zh - boxH)/2);
      }

      var box = document.createElement('div');
      box.className = 'bn-logo-box';
      box.style.cssText = 'position:absolute;left:' + boxLeft + 'px;top:' + boxTop + 'px;width:' + boxW + 'px;height:' + boxH + 'px;cursor:move;';

      img.style.cssText = 'width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;';
      zone.appendChild(box);
      box.appendChild(img);

      var handleLayer = document.createElement('div');
      handleLayer.className = 'bn-logo-handle-layer';
      handleLayer.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50;';
      ['nw','ne','sw','se'].forEach(function(c){
        var h = document.createElement('div');
        h.dataset.corner = c;
        h.style.cssText = 'position:absolute;width:14px;height:14px;border-radius:50%;background:#4a90e2;border:2px solid #fff;pointer-events:auto;'
          + (c === 'nw' || c === 'se' ? 'cursor:nwse-resize;' : 'cursor:nesw-resize;');
        handleLayer.appendChild(h);
      });
      canvas.appendChild(handleLayer);
      syncHandlePositions(box, handleLayer);

      setupDrag(box, zone, handleLayer, ratio);
      setupWheelZoom(box, zone, handleLayer, ratio);
    };
    img.src = src;
  }

  window.addEventListener('message', function(e){
    if (!e.data) return;
    if (e.data.type === 'bn-logo' || e.data.type === 'bn-logos') {
      var logos = (e.data.type === 'bn-logos') ? (e.data.logos || [])
                 : (e.data.dataUrl ? [{src: e.data.dataUrl}] : []);
      var first = logos[0];
      setTimeout(function(){ buildLogoBox(first ? first.src : null); }, 0);
    }
  });
})();
</script>
</body>
</html>
