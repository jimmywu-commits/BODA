<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>AMS BN 預覽</title>
<style>
@font-face { font-family:"ShopeeNotoSans (content)"; font-weight:300; src:url("../fonts/ShopeeNotoSans(content)-Regular.ttf") format("truetype"); }
@font-face { font-family:"ShopeeNotoSans (content)"; font-weight:400; src:url("../fonts/ShopeeNotoSans(content)-Medium.ttf") format("truetype"); }
@font-face { font-family:"ShopeeNotoSans (content)"; font-weight:700; src:url("../fonts/ShopeeNotoSans(content)-Bold.ttf") format("truetype"); }
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#1a1a1a;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#stage{position:relative;}
#canvas{position:absolute;left:0;top:0;overflow:hidden;transform-origin:top left;}
#底圖{position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;pointer-events:none;display:none;}
#ams-carousel-dots{position:absolute;left:0;top:0;width:100%;height:100%;z-index:7;pointer-events:none;display:block;}
#css-err{display:none;position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#7f1d1d;color:#fca5a5;font:13px monospace;padding:7px 16px;border-radius:6px;z-index:9999;}
</style>
</head>
<body data-fw="1077" data-fh="264">
<div id="css-err"></div>
<div id="stage">
  <div id="canvas">
    <img id="底圖" src="" alt="">
    <img id="ams-carousel-dots" class="bn-preview-only" src="../../psd/AMS_推廣者後臺BN/AMS_推廣者後臺BN-assets/輪播點app.png" alt="">
    <!-- 圖層由 layout-runtime.js 從 --layers 自動產生 -->
  </div>
</div>
<script>
(function(){
  var s=document.createElement('script');
  s.src='../js/layout-runtime.js?t='+Date.now();
  document.head.appendChild(s);
})();
</script>
</body>
</html>
