<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>SearchICON_120 排版預覽</title>
<style>
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 300;
  src: url("../fonts/ShopeeNotoSans(content)-Regular.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 400;
  src: url("../fonts/ShopeeNotoSans(content)-Medium.ttf") format("truetype");
}
@font-face {
  font-family: "ShopeeNotoSans (content)";
  font-weight: 700;
  src: url("../fonts/ShopeeNotoSans(content)-Bold.ttf") format("truetype");
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #1a1a1a;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
#stage { position: relative; }
#canvas {
  position: absolute; top: 0; left: 0;
  /* 尺寸由 layout-runtime.js 從 config.css 讀取後設定，不在這裡硬碼 */
  overflow: hidden; transform-origin: top left;
}
#底圖 {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 1; pointer-events: none; display: none;
}
#css-err {
  display: none; position: fixed;
  top: 14px; left: 50%; transform: translateX(-50%);
  background: #7f1d1d; color: #fca5a5;
  font-size: 13px; font-family: monospace;
  padding: 7px 16px; border-radius: 6px; z-index: 9999;
}
</style>
</head>
<!-- data-fw/fh：CSS 讀不到時的 fallback 尺寸（搜尋頁／搜尋結果頁 ICON：120x120px） -->
<body data-fw="120" data-fh="120">
<div id="css-err"></div>
<div id="stage">
  <div id="canvas">
    <img id="底圖" src="" alt="">
    <!-- 圖層由 layout-runtime.js 從 --layers 自動產生 -->
  </div>
</div>
<script>
/* layout-runtime.js 原本是純靜態 script 標籤載入，沒有防快取機制，
   瀏覽器可能一直用快取住的舊版本，導致改完程式碼、重新整理頁面，
   卻像是完全沒有生效。改成動態插入＋時間戳記，強制每次重新整理都
   向伺服器要最新版本。 */
(function(){
  var s = document.createElement('script');
  s.src = '../js/layout-runtime.js?t=' + Date.now();
  document.head.appendChild(s);
})();
</script>
<script>
/* ════════════════════════════════════════════════════
   SearchICON_120 專用：商品只連動「上傳曝光品的第一個」
   其他版位商品區會顯示所有已上傳商品（正三角排列），
   但此 ICON 版位只需要顯示第一個（主品），其餘自動移除。
   ════════════════════════════════════════════════════ */
(function(){
  function keepFirstProductOnly(){
    var zone = document.querySelector('.商品範圍');
    if(!zone) return;
    var boxes = Array.prototype.slice.call(zone.querySelectorAll('.bn-prod-box'));
    if(boxes.length <= 1) return;
    boxes.sort(function(a,b){
      return (parseInt(a.dataset.position, 10) || 0) - (parseInt(b.dataset.position, 10) || 0);
    });
    boxes.slice(1).forEach(function(b){ b.remove(); });
  }
  window.addEventListener('message', function(e){
    if (!e.data) return;
    if (e.data.type === 'bn-product-add' || e.data.type === 'bn-product-remove' || e.data.type === 'bn-product-zorder') {
      setTimeout(keepFirstProductOnly, 0);
    }
  });
})();
</script>
</body>
</html>
